version: 0.2

phases:
  pre_build:
    commands:
      - echo "Listing files in workspace..."
      - ls -la
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 590184140898.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=590184140898.dkr.ecr.us-east-1.amazonaws.com/divine-backend
      - IMAGE_TAG=latest
  build:
    commands:
      - echo "Building Docker image on `date`..."
      - if [ -d "backend" ]; then cd backend; fi
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
  post_build:
    commands:
      - echo "Pushing Docker image to ECR on `date`..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Image push successful!"
